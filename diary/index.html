<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYXDEWW | Diary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-page: #1a171d;
            --color-primary: #935cd8;
            --color-text-muted: #977eb6;
            --color-text-main: #e4dcf0;
            --color-border: rgba(168, 153, 188, 0.15);
        }

        /* Custom Scrollbar */
        html, .modal-content { scrollbar-width: thin; scrollbar-color: var(--color-text-muted) transparent; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        body {
            background-color: var(--color-bg-page);
            background-image: radial-gradient(circle at top left, rgba(147, 92, 216, 0.15), transparent 40%),
                              radial-gradient(circle at bottom right, rgba(147, 92, 216, 0.05), transparent 40%);
            color: var(--color-text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
            background-attachment: fixed;
        }

        header { text-align: center; margin-bottom: 35px; width: 100%; max-width: 750px; }
        h1 {
            color: var(--color-primary); margin: 0 0 10px 0;
            font-size: 2.2rem; font-weight: 700; letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(147, 92, 216, 0.4);
        }
        p.subtitle { margin: 0; color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.5; }

        #diaryContainer {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; width: 100%; max-width: 750px;
        }

        /* --- Regular Diary Card (Glassy) --- */
        .diary-card {
            background: rgba(168, 153, 188, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--color-text-main);
            border: 1px solid var(--color-border);
            padding: 20px 22px; border-radius: 14px;
            cursor: pointer; font-size: 1rem; font-weight: 600; text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-family: inherit;
        }
        .diary-card:hover {
            transform: translateY(-4px);
            background: rgba(147, 92, 216, 0.1);
            border-color: var(--color-primary);
            box-shadow: 0 10px 25px rgba(147, 92, 216, 0.2);
            color: #ffffff;
        }

        /* --- Special Diary Card (Mythic Tier - Clean Shimmer Aura) --- */
        .diary-card.special {
            background: linear-gradient(135deg, rgba(147, 92, 216, 0.18) 0%, rgba(40, 35, 45, 0.6) 100%);
            border: 1px solid rgba(147, 92, 216, 0.6);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(147, 92, 216, 0.2);
        }

        /* Efek Kilatan/Flash Kaca dari Kanan ke Kiri */
        .diary-card.special::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(147, 92, 216, 0.05) 30%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(147, 92, 216, 0.05) 70%,
                transparent 100%
            );
            transform: skewX(-25deg);
            animation: mythicShimmer 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .diary-card.special::after {
            display: none;
        }

        .diary-card.special:hover {
            transform: translateY(-4px);
            border-color: var(--color-primary);
            box-shadow: 0 0 25px rgba(147, 92, 216, 0.45);
        }

        @keyframes mythicShimmer {
            0% {
                left: 150%;
            }
            30%, 100% {
                left: -150%;
            }
        }

        /* --- Modal Window Glassy --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(26, 23, 29, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; z-index: 1000;
        }

        .modal-content {
            background-color: rgba(40, 35, 45, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(147, 92, 216, 0.4);
            border-radius: 16px; padding: 30px; width: 100%; max-width: 680px; max-height: 82vh;
            overflow-y: auto; position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 25px rgba(147, 92, 216, 0.2);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #modalTitle {
            color: var(--color-primary); margin: 0 0 20px 0; padding-right: 35px;
            font-size: 1.5rem; font-weight: 700;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 12px; letter-spacing: 0.5px;
        }
        #modalBody { color: var(--color-text-main); line-height: 1.8; font-size: 0.98rem; white-space: pre-wrap; }

        /* Styling Markdown dalam Modal */
        .diary-h1, .diary-h2, .diary-h3 { color: var(--color-primary); margin: 20px 0 10px 0; font-weight: 700; }
        .diary-h1 { font-size: 1.4rem; border-bottom: 1px dashed var(--color-text-muted); padding-bottom: 5px; }
        .diary-h2 { font-size: 1.25rem; }
        .diary-h3 { font-size: 1.1rem; }

        .diary-link {
            color: var(--color-primary); text-decoration: none; font-weight: 600;
            border-bottom: 1px dashed var(--color-primary); transition: all 0.2s;
        }
        .diary-link:hover { color: #ffffff; border-bottom-style: solid; }

        .diary-img {
            max-width: 100%; border-radius: 10px; margin: 20px 0; display: block;
            border: 1px solid var(--color-border); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .diary-quote {
            margin: 15px 0; padding: 12px 18px;
            background-color: rgba(0, 0, 0, 0.2);
            border-left: 4px solid var(--color-primary);
            color: var(--color-text-muted); font-style: italic; border-radius: 0 10px 10px 0;
        }

        .diary-code {
            background-color: rgba(0, 0, 0, 0.3); color: var(--color-primary);
            padding: 3px 8px; border-radius: 6px; font-family: monospace;
            font-size: 0.9em; border: 1px solid var(--color-border);
        }

        .close-btn {
            position: absolute; top: 22px; right: 25px;
            color: var(--color-text-muted); font-size: 26px; font-weight: bold;
            cursor: pointer; transition: 0.2s ease; line-height: 1;
        }
        .close-btn:hover { color: var(--color-primary); transform: scale(1.1); }
    </style>
</head>
<body>
    <header>
        <h1>ARYXDEWW DIARY</h1>
        <p class="subtitle">Ruang muat memori, pemikiran, dan catatan bebas.</p>
    </header>

    <main id="diaryContainer"></main>

    <div id="diaryModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Judul Diary</h2>
            <div id="modalBody">Memuat isi...</div>
        </div>
    </div>

    <!-- ENTRIES DATA -->
    <script src="data.js"></script>

    <!-- LOGIC SYSTEM -->
    <script>
        history.replaceState(null, "");

        const container = document.getElementById('diaryContainer');
        const modal = document.getElementById('diaryModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.querySelector('.close-btn');

        function parseMarkdown(text, codename) {
    let parsed = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    // Gambar: ![alt](filename)
    parsed = parsed.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, filename) => {
        return `<img src="../assets/diary/gallery/${codename}/${filename}" alt="${alt}" class="diary-img">`;
    });

    // Link: [teks](url)
    parsed = parsed.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener" class="diary-link">$1</a>');

    // Header (# , ## , ### )
    parsed = parsed.replace(/^### (.*$)/gim, '<h3 class="diary-h3">$1</h3>');
    parsed = parsed.replace(/^## (.*$)/gim, '<h2 class="diary-h2">$1</h2>');
    parsed = parsed.replace(/^# (.*$)/gim, '<h1 class="diary-h1">$1</h1>');

    // Kutipan (> teks atau &gt; teks karena sudah di-escape HTML)
    parsed = parsed.replace(/^\s*(?:&gt;|>)\s*(.*$)/gim, '<blockquote class="diary-quote">$1</blockquote>');

    // Kode Inline (`kode`)
    parsed = parsed.replace(/`([^`]+)`/g, '<code class="diary-code">$1</code>');

    // Formatting Teks: Underline, Bold, Italic
    parsed = parsed.replace(/\+\+(.*?)\+\+/g, '<u>$1</u>');
    parsed = parsed.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');
    parsed = parsed.replace(/(\*|_)(.*?)\1/g, '<em>$2</em>');

    return parsed;
}

        function renderButtons(entries) {
            container.innerHTML = '';
            entries.forEach(entry => {
                const card = document.createElement('button');
                card.className = entry.type === 'special' ? 'diary-card special' : 'diary-card';
                card.textContent = entry.title;
                card.onclick = () => openModal(entry);
                container.appendChild(card);
            });
        }

        async function openModal(entry) {
            modalTitle.textContent = entry.title;
            modalBody.textContent = "Memuat isi diary...";
            modal.style.display = 'flex';
            history.pushState({ modalOpen: true }, "");

            try {
                const response = await fetch(`../assets/diary/text/${entry.file}`);
                if (!response.ok) throw new Error('File tidak ditemukan');
                const text = await response.text();
                modalBody.innerHTML = parseMarkdown(text, entry.codename);
            } catch (error) {
                modalBody.innerHTML = `Gagal memuat. Antara file belum dibuat atau terjadi kendala jaringan.`;
            }
        }

        function closeModal() {
            if (history.state && history.state.modalOpen) {
                history.back();
            } else {
                modal.style.display = 'none';
            }
        }

        window.addEventListener('popstate', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        closeBtn.onclick = closeModal;

        window.addEventListener("keydown", function(e) {
            if (e.key === "Escape" && modal.style.display === "flex") {
                closeModal();
            }
        });

        renderButtons(diaryEntries);
    </script>
</body>
</html>
