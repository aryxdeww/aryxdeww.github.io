<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARYXDEWW | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-bg-page: #1a171d;
            --color-bg-card: #28232d;
            --color-text: #a899bc;
            --color-hover: #977eb6;
            --color-primary: #935cd8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-page);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(147, 92, 216, 0.05), transparent 40%);
        }

        .profile-card {
            background-color: var(--color-bg-card);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 153, 188, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-container {
            margin-bottom: 24px;
            display: inline-block;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: var(--color-bg-page);
            border: 3px solid var(--color-primary);
            box-shadow: 0 0 20px rgba(147, 92, 216, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(147, 92, 216, 0.4);
            border-color: var(--color-hover);
        }

        h1.display-name {
            color: var(--color-primary);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        p.tagline {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .social-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background-color: rgba(168, 153, 188, 0.05);
            color: var(--color-text);
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(168, 153, 188, 0.1);
        }

        .social-icon:hover {
            background-color: var(--color-hover);
            color: var(--color-bg-page);
            transform: translateY(-5px);
            border-color: var(--color-hover);
            box-shadow: 0 8px 15px rgba(151, 126, 182, 0.3);
        }

        .action-button {
            display: inline-block;
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-bg-page);
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .action-button:hover {
            background-color: var(--color-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(147, 92, 216, 0.4);
        }

        .action-button i {
            margin-left: 8px;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .action-button:hover i {
            transform: translateX(4px);
        }

    </style>
</head>
<body>

    <div class="profile-card">

        <div class="avatar-container">
            <div class="avatar">
                <img src="assets/arya-femboy_pose.jpg" alt="ARYXDEWW Avatar" class="profile-img">
            </div>
        </div>

        <!-- Identitas gweh -->
        <h1 class="display-name">ARYXDEWW</h1>
        <p class="tagline">Linux enthusiast, Fictophile, Introvert, Asocial.</p>

        <div class="social-links">
            <a href="https://github.com/aryxdeww" class="social-icon" aria-label="GitHub" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://www.instagram.com/aryxdeww" class="social-icon" aria-label="Instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.youtube.com/@aryxdeww" class="social-icon" aria-label="YouTube" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://www.tiktok.com/@aryxdeww" class="social-icon" aria-label="TikTok" title="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
        </div>

        <a href="#" class="action-button">
            AUTOBIOGRAPHY <i class="fas fa-arrow-right"></i>
        </a>

    </div>

</html>
